kind = "mobile"
previewPath = "/"
title = "Magiafoot"
description = "Um app mobile para fãs e jogadores acompanharem times, partidas e torneios de futebol, com dados de exemplo e personalização salva no aparelho."
version = "1.0.0"
id = "artifacts/magiafoot"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23068

[services.development]
run = "pnpm --filter @workspace/magiafoot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/magiafoot", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/magiafoot", "run", "serve" ]

[services.env]
PORT = "23068"
BASE_PATH = "/"
